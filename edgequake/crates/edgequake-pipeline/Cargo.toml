[package]
name = "edgequake-pipeline"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Document processing pipeline for EdgeQuake"

[features]
# SPEC-160: in-process decision backends for tests in other crates.
test-support = []

[dependencies]
edgequake-storage = { path = "../edgequake-storage", features = ["observability"] }
edgequake-storage-contracts = { workspace = true }
edgequake-llm = { workspace = true }
edgequake-observability = { path = "../edgequake-observability", features = ["metrics"] }

async-trait.workspace = true
chrono = { version = "0.4", features = ["serde"] }
tokio = { workspace = true, features = ["full"] }
tokio-util = "0.7"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
futures = "0.3"
regex = "1.10"
# Unicode normalization for text sanitization (SPEC-001/Issue-9)
unicode-normalization = "0.1"
# D-53: TokenEstimator SSOT (cl100k)
tiktoken-rs = { workspace = true }
# tiktoken_rs::cl100k_base_singleton returns Arc<parking_lot::Mutex<_>>
parking_lot = "0.12"
sha2 = "0.10"
# SPEC-160: closed-decision KG extraction protocol (Tev1). No `native` feature:
# EdgeQuake owns the HTTP transport and the cache, so no rusqlite/reqwest-blocking.
edgextract = { version = "0.1.0", default-features = false }
web-time = "1.1"
indexmap = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
serial_test = "3"
serde_json.workspace = true
